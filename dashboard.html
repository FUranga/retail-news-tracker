<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retail Wire — UK retail news tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  /* ---------- Design tokens: minimalist, white, data-dashboard sans-serif ---------- */
  :root {
    --paper: #ffffff;
    --panel: #fafafa;
    --ink: #14161a;
    --ink-soft: #5b6068;
    --ink-faint: #9497a0;
    --rule: #ececec;
    --rule-strong: #dcdde0;
    --accent: #1d4ed8;
    --accent-soft: #eef2ff;
    --flag: #b3261e;
    --flag-soft: #fbeceb;
    --live: #15803d;
    --live-soft: #ecf7ef;
    --disabled: #c7c9cd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  code, .mono {
    font-family: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Masthead ---------- */
  header.masthead {
    padding: 28px 0 16px;
    border-bottom: 1px solid var(--rule-strong);
  }
  .masthead-top {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .logo {
    font-weight: 700; font-size: 22px; letter-spacing: -0.02em;
  }
  .logo .dot { color: var(--accent); }
  .masthead-meta {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.06em;
    text-align: right; line-height: 1.7;
  }
  .masthead-meta strong { color: var(--ink-soft); font-weight: 600; }

  /* ---------- Stream tabs ---------- */
  nav.streams {
    display: flex; gap: 4px; flex-wrap: wrap;
    padding: 14px 0; margin-bottom: 4px;
  }
  .stream-tab {
    font-size: 13px; font-weight: 500;
    padding: 7px 14px; border: 1px solid transparent; border-radius: 999px;
    background: none; color: var(--ink-soft); cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .stream-tab:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
  .stream-tab.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .stream-tab:disabled { color: var(--disabled); cursor: not-allowed; }
  .stream-tab .soon {
    font-family: ui-monospace, monospace; font-size: 8.5px; vertical-align: super;
    margin-left: 3px; letter-spacing: 0.04em;
  }
  .stream-tab .count {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    background: rgba(0,0,0,.06); border-radius: 8px; font-size: 10px; font-weight: 600;
  }
  .stream-tab.active .count { background: var(--accent); color: #fff; }

  /* ---------- Control bar ---------- */
  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 10px 0 18px;
  }
  .seg {
    display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 8px;
    overflow: hidden;
  }
  .seg button {
    font-size: 12px; font-weight: 500;
    padding: 7px 14px; border: none; background: var(--paper);
    color: var(--ink-soft); cursor: pointer; transition: background .12s, color .12s;
  }
  .seg button + button { border-left: 1px solid var(--rule-strong); }
  .seg button.active { background: var(--ink); color: #fff; }

  .filter-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, .search-box {
    font-size: 12.5px; padding: 7px 10px; border: 1px solid var(--rule-strong);
    border-radius: 8px; background: var(--paper); color: var(--ink);
  }
  select:focus, .search-box:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .search-box { min-width: 190px; }

  .noise-toggle {
    font-size: 12px; color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
  }
  .noise-toggle input { cursor: pointer; accent-color: var(--accent); }

  .spacer { flex: 1; }
  .result-count {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* ---------- Story list ---------- */
  .stories { border-top: 1px solid var(--rule); }
  .story {
    border-bottom: 1px solid var(--rule);
    padding: 16px 4px; transition: background .1s;
  }
  .story-row {
    display: grid;
    grid-template-columns: 76px 1fr auto;
    gap: 16px; align-items: start; cursor: pointer;
  }
  .story-time {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; color: var(--ink-faint); padding-top: 3px; line-height: 1.4;
  }
  .story-time .date { display: block; font-size: 10px; color: var(--ink-faint); }
  .story-main { min-width: 0; }
  .story-flags { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; flex-wrap: wrap; }
  .tag {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 7px; border-radius: 4px; font-weight: 600;
  }
  .tag-stream { background: var(--accent-soft); color: var(--accent); }
  .tag-type { background: var(--panel); color: var(--ink-soft); border: 1px solid var(--rule-strong); }
  .tag-paywall { background: var(--flag-soft); color: var(--flag); }
  .tag-new { background: var(--live-soft); color: var(--live); }
  .tag-reviewed { background: #f5f0ff; color: #6d28d9; }
  .story-title {
    font-size: 17px; line-height: 1.35; font-weight: 600; letter-spacing: -0.01em;
    margin-bottom: 4px; color: var(--ink);
  }
  .story.is-noise .story-title { color: var(--ink-soft); font-weight: 500; }
  .story-company {
    font-size: 12.5px; color: var(--ink-soft);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .story-company .ticker { color: var(--accent); font-weight: 600; }
  .story-chevron {
    color: var(--ink-faint); font-size: 12px; padding-top: 6px;
    transition: transform .15s;
  }
  .story.expanded .story-chevron { transform: rotate(90deg); }

  /* ---------- Expanded panel: body text + actions ---------- */
  .story-panel {
    display: none; margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--rule-strong);
  }
  .story.expanded .story-panel { display: block; }
  .story-body {
    font-size: 14px; line-height: 1.7; color: var(--ink-soft);
    max-height: 320px; overflow-y: auto;
    background: var(--panel); border-radius: 8px; padding: 14px 16px;
    margin-bottom: 12px;
  }
  .story-body.empty { font-style: italic; color: var(--ink-faint); }
  .story-body p { margin-bottom: 10px; }
  .story-body p:last-child { margin-bottom: 0; }
  .story-body strong, .story-body b { color: var(--ink); font-weight: 600; }
  .story-body table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 10px 0; }
  .story-body th, .story-body td { border: 1px solid var(--rule-strong); padding: 5px 8px; text-align: left; }
  .story-body th { background: var(--rule); font-weight: 600; }
  .story-body h1, .story-body h2, .story-body h3 { font-size: 14px; font-weight: 600; color: var(--ink); margin: 12px 0 4px; }
  .story-actions-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    font-size: 12px; font-weight: 500;
    padding: 7px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink);
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { background: var(--panel); }
  .btn-primary { border-color: var(--accent); color: var(--accent); }
  .btn-primary:hover { background: var(--accent); color: #fff; }
  .btn:disabled { color: var(--disabled); border-color: var(--rule); cursor: not-allowed; background: var(--paper); }
  .btn-link {
    font-size: 11px; color: var(--ink-faint); text-decoration: none;
    padding: 7px 4px;
  }
  .btn-link:hover { color: var(--accent); }
  .copy-feedback {
    font-size: 11px; color: var(--live); font-weight: 600; opacity: 0;
    transition: opacity .15s;
  }
  .copy-feedback.show { opacity: 1; }

  .empty-state {
    padding: 60px 20px; text-align: center; color: var(--ink-faint); font-size: 13px;
  }

  footer {
    margin: 44px 0 28px; padding-top: 16px; border-top: 1px solid var(--rule);
    font-size: 11.5px; color: var(--ink-faint); line-height: 1.7;
  }
  footer .roadmap { margin-top: 6px; }
  footer .roadmap b { color: var(--ink-soft); }

  @media (max-width: 640px) {
    .story-row { grid-template-columns: 1fr; gap: 6px; }
    .story-time { padding-top: 0; }
    .masthead-meta { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-top">
      <div class="logo">Retail Wire<span class="dot">.</span></div>
      <div class="masthead-meta">
        <div>UK retail news tracker</div>
        <div><strong id="meta-window">Today</strong> · updated <strong id="meta-updated">—</strong></div>
      </div>
    </div>
  </header>

  <nav class="streams" id="streams"></nav>

  <div class="controls">
    <div class="seg" id="window-seg">
      <button data-window="today" class="active">Today</button>
      <button data-window="history">History</button>
    </div>
    <div class="filter-group">
      <select id="filter-type"><option value="">Story type · all</option></select>
      <select id="filter-company"><option value="">Company · all</option></select>
      <input type="text" class="search-box" id="search" placeholder="Search headlines…">
      <label class="noise-toggle" id="noise-toggle-label">
        <input type="checkbox" id="noise-toggle"> Hide regulatory noise
      </label>
    </div>
    <div class="spacer"></div>
    <div class="result-count" id="result-count">—</div>
  </div>

  <div class="stories" id="stories"></div>

  <footer>
    Retail Wire · Module 1 live: <b>LSE press releases</b>. Every story always links to its original source.
    <div class="roadmap">
      Upcoming modules (buttons already visible, disabled): <b>News</b> (UK media) ·
      <b>Government</b> (ONS / GOV.UK) · <b>Companies</b> · <b>Suppliers</b> · weekly agenda.
    </div>
  </footer>

</div>

<script>
// ---------- Stream configuration (tabs) ----------
const STREAMS = [
  { key: "all",           label: "All",            enabled: true  },
  { key: "press_release", label: "Press releases", enabled: true  },
  { key: "news",          label: "News",           enabled: false },
  { key: "government",    label: "Government",     enabled: false },
  { key: "company",       label: "Companies",      enabled: false },
  { key: "supplier",      label: "Suppliers",      enabled: false },
];

let DATA = { items: [], generated_at: null };
let state = { stream: "all", window: "today", type: "", company: "", search: "", hideNoise: false, expanded: new Set() };

const DATA_SOURCES = ["dashboard_data.json", "sample_data.json"];

async function loadData() {
  for (const src of DATA_SOURCES) {
    try {
      const res = await fetch(src);
      if (!res.ok) continue;
      DATA = await res.json();
      break;
    } catch (e) { /* try next source */ }
  }
  renderMeta();
  renderStreams();
  buildFilterOptions();
  render();
}

function renderMeta() {
  const upd = DATA.generated_at ? new Date(DATA.generated_at) : null;
  document.getElementById("meta-updated").textContent = upd
    ? upd.toLocaleString("en-GB", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" })
    : "—";
}

// "Today" = editorial window: from yesterday 16:00 onward (spans two calendar days).
function todayWindowStart() {
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() - 1);
  start.setHours(16, 0, 0, 0);
  return start;
}

function inWindow(item) {
  if (state.window === "history") return true;
  return new Date(item.datetime) >= todayWindowStart();
}

// ---------- Streams ----------
function renderStreams() {
  const nav = document.getElementById("streams");
  nav.innerHTML = "";
  STREAMS.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "stream-tab" + (state.stream === s.key ? " active" : "");
    btn.disabled = !s.enabled;
    const count = s.enabled ? countForStream(s.key) : 0;
    btn.innerHTML = s.label
      + (s.enabled && count ? `<span class="count">${count}</span>` : "")
      + (s.enabled ? "" : `<span class="soon">soon</span>`);
    if (s.enabled) btn.onclick = () => { state.stream = s.key; renderStreams(); render(); };
    nav.appendChild(btn);
  });
}

function countForStream(key) {
  return DATA.items.filter(it => inWindow(it) && (key === "all" || it.stream === key)).length;
}

// ---------- Filters ----------
function buildFilterOptions() {
  const types = [...new Set(DATA.items.map(i => i.story_type).filter(Boolean))].sort();
  const companies = [...new Set(DATA.items.map(i => i.companyname).filter(Boolean))].sort();
  const typeSel = document.getElementById("filter-type");
  const compSel = document.getElementById("filter-company");
  types.forEach(t => typeSel.insertAdjacentHTML("beforeend", `<option value="${t}">${t}</option>`));
  companies.forEach(c => compSel.insertAdjacentHTML("beforeend", `<option value="${c}">${c}</option>`));
}

// ---------- Bloomberg-method prompt builder ----------
// This is copied to the clipboard, not sent anywhere — the dashboard has no
// backend and never calls any AI directly. Paste it into a Claude
// conversation to get the actual draft.
function buildDraftPrompt(item) {
  return `Write a news story about the press release below, following Bloomberg's four-paragraph lead method and Retail Week house style.

BLOOMBERG METHOD:
- Headline: max ~64 characters. Lead with the newsworthy name. First few words must hook the reader. Convey what's at stake.
- Paragraph 1 (the lead/theme): what happened AND why it matters ("what... so what"). Under 20 words if possible. Only the single most newsworthy figure — no pile of numbers.
- Paragraph 2 (details): the essential facts and figures that support the theme. Dose the data — don't dump every number, save the rest for later in the piece.
- Paragraph 3 (quote): a plain-English quote from an authoritative source backing the theme. If none is available in the source material, note that a quote is needed rather than inventing one.
- Paragraph 4 (nut graph): what's at stake going forward — winners/losers, outlook. This paragraph should NOT be something that could have been written yesterday; it must reflect today's news specifically.
- Include a short "to be sure" section (1-2 paragraphs) presenting at least one other side of the story.

RETAIL WEEK STYLE:
- Terse, straightforward. No padding, no throat-clearing.
- British English spelling and terminology throughout.
- Present tense for immediate developments where natural.

SOURCE MATERIAL
Company: ${item.companyname || "—"} ${item.companycode ? "(" + item.companycode + ")" : ""}
Headline: ${item.title}
Date: ${item.datetime}
Sector: ${item.icbsector || "—"}
Source URL: ${item.url || "—"}

Full press release text:
"""
${item.body || "(no body text captured for this item)"}
"""

Write the draft now.`;
}

async function copyToClipboard(text, feedbackEl) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) { /* give up silently */ }
    document.body.removeChild(ta);
  }
  if (feedbackEl) {
    feedbackEl.classList.add("show");
    setTimeout(() => feedbackEl.classList.remove("show"), 1400);
  }
}

// ---------- Main render ----------
function currentItems() {
  return DATA.items
    .filter(inWindow)
    .filter(it => state.stream === "all" || it.stream === state.stream)
    .filter(it => !state.type || it.story_type === state.type)
    .filter(it => !state.company || it.companyname === state.company)
    .filter(it => !state.search || it.title.toLowerCase().includes(state.search.toLowerCase()))
    .filter(it => !state.hideNoise || !it.is_noise)
    .sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
}

function render() {
  const items = currentItems();
  const box = document.getElementById("stories");
  document.getElementById("result-count").textContent =
    `${items.length} ${items.length === 1 ? "story" : "stories"}`;
  document.getElementById("meta-window").textContent =
    state.window === "today" ? "Today" : "History";

  if (!items.length) {
    box.innerHTML = `<div class="empty-state">No stories match these filters.</div>`;
    return;
  }

  box.innerHTML = items.map((it, idx) => {
    const uid = String(it.id ?? idx);
    const d = new Date(it.datetime);
    const time = d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
    const date = d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" });
    const isNew = new Date(it.datetime) >= todayWindowStart();
    const streamLabel = (STREAMS.find(s => s.key === it.stream) || {}).label || it.stream;
    const isExpanded = state.expanded.has(uid);

    const flags = [
      `<span class="tag tag-stream">${streamLabel}</span>`,
      it.story_type ? `<span class="tag tag-type">${it.story_type}</span>` : "",
      it.paywall ? `<span class="tag tag-paywall">Paywall</span>` : "",
      (isNew && state.window === "history") ? `<span class="tag tag-new">New</span>` : "",
      it.reviewed_by ? `<span class="tag tag-reviewed" title="${it.review_note ? it.review_note.replace(/"/g,'&quot;') : ''}">AI-reviewed</span>` : "",
    ].filter(Boolean).join("");

    const company = it.companyname
      ? `<span class="story-company">${it.companyname}${it.companycode ? ` · <span class="ticker">${it.companycode}</span>` : ""}${it.icbsector ? ` · ${it.icbsector}` : ""}</span>`
      : `<span class="story-company">${it.source || ""}</span>`;

    const bodyHtml = it.body
      ? `<div class="story-body">${typeof marked !== 'undefined' ? marked.parse(it.body) : escapeHtml(it.body)}</div>`
      : `<div class="story-body empty">No full text captured for this item yet.</div>`;

    return `
      <article class="story${it.is_noise ? " is-noise" : ""}${isExpanded ? " expanded" : ""}" data-uid="${uid}">
        <div class="story-row" data-toggle="${uid}">
          <div class="story-time">${time}<span class="date">${date}</span></div>
          <div class="story-main">
            <div class="story-flags">${flags}</div>
            <h2 class="story-title">${it.title}</h2>
            ${company}
          </div>
          <div class="story-chevron">›</div>
        </div>
        <div class="story-panel">
          ${bodyHtml}
          <div class="story-actions-row">
            <button class="btn" data-copy="${uid}">Copy text</button>
            <button class="btn btn-primary" data-draft="${uid}" ${it.body ? "" : "disabled"}>Copy Bloomberg draft prompt</button>
            ${it.url ? `<a class="btn-link" href="${it.url}" target="_blank" rel="noopener">Source ↗</a>` : ""}
            <span class="copy-feedback" data-feedback="${uid}">Copied</span>
          </div>
        </div>
      </article>`;
  }).join("");

  // Wire up per-story events (row toggle + copy buttons)
  box.querySelectorAll("[data-toggle]").forEach(row => {
    row.addEventListener("click", () => {
      const uid = row.dataset.toggle;
      if (state.expanded.has(uid)) state.expanded.delete(uid); else state.expanded.add(uid);
      render();
    });
  });
  box.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const uid = btn.dataset.copy;
      const item = items.find((it, idx) => String(it.id ?? idx) === uid);
      const fb = box.querySelector(`[data-feedback="${uid}"]`);
      copyToClipboard(item.body || "", fb);
    });
  });
  box.querySelectorAll("[data-draft]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const uid = btn.dataset.draft;
      const item = items.find((it, idx) => String(it.id ?? idx) === uid);
      const fb = box.querySelector(`[data-feedback="${uid}"]`);
      copyToClipboard(buildDraftPrompt(item), fb);
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Events ----------
document.getElementById("window-seg").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#window-seg button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  state.window = e.target.dataset.window;
  renderStreams(); render();
});
document.getElementById("filter-type").addEventListener("change", e => { state.type = e.target.value; render(); });
document.getElementById("filter-company").addEventListener("change", e => { state.company = e.target.value; render(); });
document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; render(); });
document.getElementById("noise-toggle").addEventListener("change", e => { state.hideNoise = e.target.checked; render(); });

loadData();
</script>
</body>
</html>
