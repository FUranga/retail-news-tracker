<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retail Wire — UK retail news tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  /* ---------- Design tokens: minimalist, white, data-dashboard sans-serif ---------- */
  :root {
    --paper: #ffffff;
    --panel: #fafafa;
    --ink: #14161a;
    --ink-soft: #5b6068;
    --ink-faint: #9497a0;
    --rule: #ececec;
    --rule-strong: #dcdde0;
    --accent: #1d4ed8;
    --accent-soft: #eef2ff;
    --flag: #b3261e;
    --flag-soft: #fbeceb;
    --live: #15803d;
    --live-soft: #ecf7ef;
    --disabled: #c7c9cd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  code, .mono {
    font-family: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Masthead ---------- */
  header.masthead {
    padding: 28px 0 16px;
    border-bottom: 1px solid var(--rule-strong);
  }
  .masthead-top {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .logo {
    font-weight: 700; font-size: 22px; letter-spacing: -0.02em;
  }
  .logo .dot { color: var(--accent); }
  .masthead-meta {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.06em;
    text-align: right; line-height: 1.7;
  }
  .masthead-meta strong { color: var(--ink-soft); font-weight: 600; }

  /* ---------- Stream tabs ---------- */
  nav.streams {
    display: flex; gap: 4px; flex-wrap: wrap;
    padding: 14px 0; margin-bottom: 4px;
  }
  .stream-tab {
    font-size: 13px; font-weight: 500;
    padding: 7px 14px; border: 1px solid transparent; border-radius: 999px;
    background: none; color: var(--ink-soft); cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .stream-tab:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
  .stream-tab.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .stream-tab:disabled { color: var(--disabled); cursor: not-allowed; }
  .stream-tab .soon {
    font-family: ui-monospace, monospace; font-size: 8.5px; vertical-align: super;
    margin-left: 3px; letter-spacing: 0.04em;
  }
  .stream-tab .count {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    background: rgba(0,0,0,.06); border-radius: 8px; font-size: 10px; font-weight: 600;
  }
  .stream-tab.active .count { background: var(--accent); color: #fff; }

  /* ---------- Control bar ---------- */
  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 10px 0 18px;
  }
  .seg {
    display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 8px;
    overflow: hidden;
  }
  .seg button {
    font-size: 12px; font-weight: 500;
    padding: 7px 14px; border: none; background: var(--paper);
    color: var(--ink-soft); cursor: pointer; transition: background .12s, color .12s;
  }
  .seg button + button { border-left: 1px solid var(--rule-strong); }
  .seg button.active { background: var(--ink); color: #fff; }

  .filter-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, .search-box {
    font-size: 12.5px; padding: 7px 10px; border: 1px solid var(--rule-strong);
    border-radius: 8px; background: var(--paper); color: var(--ink);
  }
  select:focus, .search-box:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .search-box { min-width: 190px; }

  .noise-toggle {
    font-size: 12px; color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
  }
  .noise-toggle input { cursor: pointer; accent-color: var(--accent); }

  /* Etiquetas clicables de empresa */
  .company-tags {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 8px 0 4px;
  }
  .company-tag {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--rule-strong); background: var(--paper);
    color: var(--ink-soft); cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .company-tag:hover { background: var(--panel); color: var(--ink); }
  .company-tag.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Filtro de sectores */
  .sector-filters {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 4px 0 12px;
  }
  .sector-pill {
    font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 999px;
    border: 1.5px solid transparent; cursor: pointer;
    transition: opacity .12s, border-color .12s;
    opacity: 0.55;
  }
  .sector-pill:hover { opacity: 0.8; }
  .sector-pill.active { opacity: 1; border-color: currentColor; }

  .spacer { flex: 1; }
  .result-count {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* ---------- Story list ---------- */
  .stories { border-top: 1px solid var(--rule); }
  .story {
    border-bottom: 1px solid var(--rule);
    padding: 16px 4px; transition: background .1s;
  }
  .story-row {
    display: grid;
    grid-template-columns: 76px 1fr auto;
    gap: 16px; align-items: start; cursor: pointer;
  }
  .story-time {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; color: var(--ink-faint); padding-top: 3px; line-height: 1.4;
  }
  .story-time .date { display: block; font-size: 10px; color: var(--ink-faint); }
  .story-main { min-width: 0; }
  .story-flags { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; flex-wrap: wrap; }
  .tag {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 7px; border-radius: 4px; font-weight: 600;
  }
  .tag-stream { background: var(--accent-soft); color: var(--accent); }
  .tag-source { background: #f0f0f0; color: var(--ink-soft); font-style: italic; }
  .tag-type { background: var(--panel); color: var(--ink-soft); border: 1px solid var(--rule-strong); }
  .tag-paywall { background: var(--flag-soft); color: var(--flag); }
  .tag-new { background: var(--live-soft); color: var(--live); }
  .tag-reviewed { background: #f5f0ff; color: #6d28d9; }
  .tag-tech { background: #e6f7ff; color: #0369a1; }
  .story-title {
    font-size: 17px; line-height: 1.35; font-weight: 700; letter-spacing: -0.01em;
    margin-bottom: 4px; color: var(--ink);
  }
  .story.is-read .story-title { font-weight: 400; color: var(--ink-soft); }
  .story.is-noise .story-title { color: var(--ink-soft); font-weight: 500; }
  .story.is-noise.is-read .story-title { font-weight: 400; }
  .story-company {
    font-size: 12.5px; color: var(--ink-soft);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .story-company .ticker { color: var(--accent); font-weight: 600; }
  .story-chevron {
    color: var(--ink-faint); font-size: 12px; padding-top: 6px;
    transition: transform .15s;
  }
  .story.expanded .story-chevron { transform: rotate(90deg); }

  /* ---------- Expanded panel: body text + actions ---------- */
  .story-panel {
    display: none; margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--rule-strong);
  }
  .story.expanded .story-panel { display: block; }
  .story-body {
    font-size: 14px; line-height: 1.7; color: var(--ink-soft);
    max-height: 320px; overflow-y: auto;
    background: var(--panel); border-radius: 8px; padding: 14px 16px;
    margin-bottom: 12px;
  }
  .story-body.empty { font-style: italic; color: var(--ink-faint); }
  .story-body p { margin-bottom: 10px; }
  .story-body p:last-child { margin-bottom: 0; }
  .story-body strong, .story-body b { color: var(--ink); font-weight: 600; }
  .story-body table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 10px 0; }
  .story-body th, .story-body td { border: 1px solid var(--rule-strong); padding: 5px 8px; text-align: left; }
  .story-body th { background: var(--rule); font-weight: 600; }
  .story-body h1, .story-body h2, .story-body h3 { font-size: 14px; font-weight: 600; color: var(--ink); margin: 12px 0 4px; }
  .story-actions-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn {
    font-size: 12px; font-weight: 500;
    padding: 7px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink);
    transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover { background: var(--panel); }
  .btn-primary { border-color: var(--accent); color: var(--accent); }
  .btn-primary:hover { background: var(--accent); color: #fff; }
  .btn:disabled { color: var(--disabled); border-color: var(--rule); cursor: not-allowed; background: var(--paper); }
  .btn-link {
    font-size: 11px; color: var(--ink-faint); text-decoration: none;
    padding: 7px 4px;
  }
  .btn-link:hover { color: var(--accent); }
  .copy-feedback {
    font-size: 11px; color: var(--live); font-weight: 600; opacity: 0;
    transition: opacity .15s;
  }
  .copy-feedback.show { opacity: 1; }

  .empty-state {
    padding: 60px 20px; text-align: center; color: var(--ink-faint); font-size: 13px;
  }

  footer {
    margin: 44px 0 28px; padding-top: 16px; border-top: 1px solid var(--rule);
    font-size: 11.5px; color: var(--ink-faint); line-height: 1.7;
  }
  footer .roadmap { margin-top: 6px; }
  footer .roadmap b { color: var(--ink-soft); }

  @media (max-width: 640px) {
    .story-row { grid-template-columns: 1fr; gap: 6px; }
    .story-time { padding-top: 0; }
    .masthead-meta { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---------- Agenda (Module 7) ---------- */
  .agenda-toolbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 0 16px;
  }
  .agenda-nav { display: flex; align-items: center; gap: 8px; }
  .agenda-nav button {
    border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink-soft);
    border-radius: 6px; width: 26px; height: 26px; cursor: pointer; font-size: 12px;
  }
  .agenda-nav button:hover { background: var(--panel); color: var(--ink); }
  .agenda-range-label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; color: var(--ink-soft);
  }
  .agenda-add-btn { margin-left: auto; }

  .agenda-manual-form {
    display: none; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 12px; margin-bottom: 12px; border: 1px solid var(--rule-strong); border-radius: 8px;
    background: var(--panel);
  }
  .agenda-manual-form.open { display: flex; }
  .agenda-manual-form input, .agenda-manual-form select {
    font-size: 12.5px; padding: 6px 9px; border: 1px solid var(--rule-strong);
    border-radius: 6px; background: var(--paper); color: var(--ink);
  }
  .agenda-manual-form label { font-size: 12px; color: var(--ink-soft); display: flex; align-items: center; gap: 4px; }

  .agenda-day-header {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-faint); padding: 14px 4px 6px; border-bottom: 1px solid var(--rule);
  }
  .agenda-day-header:first-child { padding-top: 0; }

  .agenda-card { padding: 12px 4px; border-bottom: 1px solid var(--rule); }
  .agenda-card-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
  .agenda-cat {
    font-family: ui-monospace, monospace; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 2px 7px; border-radius: 4px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent);
  }
  .agenda-time { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-faint); }
  .agenda-badge-unconfirmed { font-size: 10px; padding: 2px 7px; border-radius: 4px; background: var(--flag-soft); color: var(--flag); }
  .agenda-manual-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; background: #f5f0ff; color: #6d28d9; }
  .agenda-cover-toggle { margin-left: auto; font-size: 12px; color: var(--ink-soft); display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .agenda-title { font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 3px; color: var(--ink); }
  .agenda-company, .agenda-location {
    font-size: 12.5px; color: var(--ink-soft);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .agenda-summary { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin: 6px 0 2px; }
  .agenda-meta-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-top: 6px; }
  .agenda-meta-row a { color: var(--accent); text-decoration: none; }
  .agenda-meta-row a:hover { text-decoration: underline; }
  .agenda-research {
    margin-top: 10px; padding: 12px 14px; border-radius: 8px;
    background: var(--panel); font-size: 13.5px; line-height: 1.6; color: var(--ink-soft);
  }
  .agenda-research-label {
    font-family: ui-monospace, monospace; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 6px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="masthead-top">
      <div class="logo">Retail Wire<span class="dot">.</span></div>
      <div class="masthead-meta">
        <div>UK retail news tracker</div>
        <div><strong id="meta-window">Today</strong> · updated <strong id="meta-updated">—</strong></div>
      </div>
    </div>
  </header>

  <nav class="streams" id="streams"></nav>

  <div class="sector-filters" id="sector-filters"></div>

  <div class="controls">
    <div class="seg" id="window-seg">
      <button data-window="today" class="active">Today</button>
      <button data-window="history">History</button>
    </div>
    <div class="filter-group">
      <select id="filter-type"><option value="">Story type · all</option></select>
      <input type="text" class="search-box" id="search" placeholder="Search headlines…">
      <label class="noise-toggle" id="noise-toggle-label">
        <input type="checkbox" id="noise-toggle"> Hide regulatory noise
      </label>
      <label class="noise-toggle" id="tech-toggle-label">
        <input type="checkbox" id="tech-toggle"> Tech/AI partnerships only
      </label>
    </div>
    <div class="spacer"></div>
    <div class="result-count" id="result-count">—</div>
  </div>

  <div class="company-tags" id="company-tags"></div>

  <div class="agenda-toolbar" id="agenda-toolbar" style="display:none">
    <div class="agenda-nav">
      <button id="agenda-prev" title="Ventana anterior">◀</button>
      <span class="agenda-range-label" id="agenda-range-label"></span>
      <button id="agenda-next" title="Próxima ventana">▶</button>
    </div>
    <div class="seg">
      <button id="agenda-filter-todos" class="active">Todos</button>
      <button id="agenda-filter-cubrir">A cubrir</button>
    </div>
    <button class="btn agenda-add-btn" id="agenda-add-toggle">+ Agregar evento</button>
    <button class="btn" id="agenda-settings-toggle" title="Configurar guardado en GitHub">⚙</button>
  </div>

  <form class="agenda-manual-form" id="agenda-settings-form">
    <label style="flex:1 1 100%; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;">
      Guardado en GitHub — se usa para que los eventos manuales persistan de verdad (commit directo a manual_events.json)
    </label>
    <input name="gh_owner" placeholder="usuario u organización (ej: FUranga)" style="flex:1 1 180px">
    <input name="gh_repo" placeholder="nombre del repo (ej: retail-news-tracker)" style="flex:1 1 200px">
    <input name="gh_path" placeholder="ruta al archivo (ej: manual_events.json)" style="flex:1 1 200px">
    <input name="gh_token" type="password" placeholder="token (fine-grained, solo este repo)" style="flex:1 1 220px">
    <button type="submit" class="btn btn-primary">Guardar config</button>
    <span class="copy-feedback" id="agenda-settings-feedback">Guardado</span>
  </form>

  <form class="agenda-manual-form" id="agenda-manual-form">
    <input name="title" placeholder="Título" required style="flex:2 1 200px">
    <input name="date" type="date" required>
    <input name="time" type="time">
    <input name="location" placeholder="Lugar" style="flex:1 1 140px">
    <select name="category">
      <option value="evento-sectorial">Evento sectorial</option>
      <option value="estadistica">Estadística</option>
      <option value="earnings">Earnings/AGM</option>
      <option value="informe">Informe</option>
      <option value="reunion-publica">Reunión pública</option>
    </select>
    <label><input type="checkbox" name="registration_required"> inscripción</label>
    <input name="registration_link" placeholder="Link inscripción (opcional)" style="flex:1 1 160px">
    <textarea name="summary" placeholder="Descripción (opcional) — de qué trata, contexto, lo que tengas" style="flex:1 1 100%; min-height:50px; font-family:inherit; font-size:12.5px; padding:6px 9px; border:1px solid var(--rule-strong); border-radius:6px; background:var(--paper); color:var(--ink); resize:vertical;"></textarea>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <span class="copy-feedback" id="agenda-manual-feedback">Guardado</span>
  </form>

  <div class="stories" id="stories"></div>

  <footer>
    Retail Wire · Modules live: <b>LSE press releases</b>, <b>News</b>, <b>Government</b>, <b>Companies</b>, <b>Agenda</b>. Every story always links to its original source.
    <div class="roadmap">
      Upcoming: <b>Suppliers</b> · Email capture.
    </div>
  </footer>

</div>

<script>
// ---------- Stream configuration (tabs) ----------
const STREAMS = [
  { key: "all",           label: "All",            enabled: true  },
  { key: "press_release", label: "Press releases", enabled: true  },
  { key: "news",          label: "News",           enabled: true  },
  { key: "government",    label: "Government",     enabled: true  },
  { key: "company",       label: "Companies",      enabled: true  },
  { key: "supplier",      label: "Suppliers",      enabled: true  },
  { key: "agenda",        label: "Agenda",         enabled: true  },
];

let DATA = { items: [], generated_at: null };
let SECTOR_CONFIG = { categories: [], retailer_categories: {} };
let state = { stream: "all", window: "today", type: "", company: "", sector: "", search: "", hideNoise: false, techOnly: false, expanded: new Set() };

// ---------- Agenda (Module 7) ----------
let AGENDA_DATA = [];
const AGENDA_SOURCES = ["agenda_data.json"];
const AGENDA_OVERRIDES_KEY = "agenda_to_cover_overrides"; // to_cover marcado en el cliente, antes del próximo scrape
let agendaState = { windowOffset: 0, windowSizeDays: 14, filter: "todos" };

const AGENDA_CATEGORY_LABELS = {
  "estadistica": "Estadística", "earnings": "Earnings/AGM", "informe": "Informe",
  "reunion-publica": "Reunión pública", "evento-sectorial": "Evento sectorial",
};

function getAgendaOverrides() {
  try { return JSON.parse(localStorage.getItem(AGENDA_OVERRIDES_KEY) || "{}"); }
  catch(e) { return {}; }
}
function setAgendaOverride(id, val) {
  const o = getAgendaOverrides(); o[id] = val;
  localStorage.setItem(AGENDA_OVERRIDES_KEY, JSON.stringify(o));
}
function agendaToCover(ev) {
  const o = getAgendaOverrides();
  return ev.id in o ? o[ev.id] : ev.to_cover;
}

// ---------- Persistencia real de eventos manuales (GitHub Contents API) ----------
// No hay backend: el dashboard es estático (GitHub Pages). Para que el
// form de alta manual persista de verdad (y no se pierda al refrescar),
// commiteamos directo a manual_events.json en el repo usando un token
// guardado SOLO en localStorage de tu navegador — nunca sale de ahí salvo
// para pegar en las requests a api.github.com.
const GH_CONFIG_KEY = "agenda_gh_config";

function getGhConfig() {
  try { return JSON.parse(localStorage.getItem(GH_CONFIG_KEY) || "{}"); }
  catch(e) { return {}; }
}
function setGhConfig(cfg) {
  localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(cfg));
}
function ghConfigured() {
  const c = getGhConfig();
  return !!(c.gh_owner && c.gh_repo && c.gh_path && c.gh_token);
}

function b64EncodeUnicode(str) {
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str) {
  return decodeURIComponent(escape(atob(str)));
}

async function githubGetManualEvents() {
  const c = getGhConfig();
  const url = `https://api.github.com/repos/${c.gh_owner}/${c.gh_repo}/contents/${c.gh_path}`;
  const res = await fetch(url, {
    headers: { Authorization: `Bearer ${c.gh_token}`, Accept: "application/vnd.github+json" },
  });
  if (res.status === 404) return { sha: null, events: [] }; // el archivo todavía no existe en el repo
  if (!res.ok) throw new Error(`GitHub GET ${res.status}: ${await res.text()}`);
  const data = await res.json();
  const events = JSON.parse(b64DecodeUnicode(data.content) || "[]");
  return { sha: data.sha, events };
}

async function githubPutManualEvents(events, sha, message) {
  const c = getGhConfig();
  const url = `https://api.github.com/repos/${c.gh_owner}/${c.gh_repo}/contents/${c.gh_path}`;
  const body = {
    message,
    content: b64EncodeUnicode(JSON.stringify(events, null, 2)),
    ...(sha ? { sha } : {}),
  };
  const res = await fetch(url, {
    method: "PUT",
    headers: { Authorization: `Bearer ${c.gh_token}`, Accept: "application/vnd.github+json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`GitHub PUT ${res.status}: ${await res.text()}`);
  return res.json();
}

async function saveManualEvent(ev) {
  const { sha, events } = await githubGetManualEvents();
  events.push(ev);
  await githubPutManualEvents(events, sha, `agenda: agregar "${ev.title}"`);
}

async function deleteManualEvent(id) {
  const { sha, events } = await githubGetManualEvents();
  const filtered = events.filter(e => e.id !== id);
  await githubPutManualEvents(filtered, sha, `agenda: borrar evento ${id}`);
}

      const mediaData = await res.json();

      DATA.items = [...DATA.items, ...newItems];
      break;
    } catch (e) { /* media data no disponible todavía */ }
  }

  // Cargar gov data y mergear
  for (const src of GOV_SOURCES) {
    try {
      const res = await fetch(src);
      if (!res.ok) continue;
      const govData = await res.json();
      const existingKeys = new Set(DATA.items.map(i => `${i.stream}:${i.url}`).filter(Boolean));
      const newItems = (govData.items || []).filter(i => !existingKeys.has(`${i.stream}:${i.url}`));
      DATA.items = [...DATA.items, ...newItems];
      break;
    } catch (e) { /* gov data no disponible todavía */ }
  }

  // Cargar company data y mergear
  for (const src of COMPANY_SOURCES) {
    try {
      const res = await fetch(src);
      if (!res.ok) continue;
      const companyData = await res.json();
      const existingKeys = new Set(DATA.items.map(i => `${i.stream}:${i.url}`).filter(Boolean));
      const newItems = (companyData.items || []).filter(i => !existingKeys.has(`${i.stream}:${i.url}`));
      DATA.items = [...DATA.items, ...newItems];
      break;
    } catch (e) { /* company data no disponible todavía */ }
  }

  // Cargar supplier data y mergear
  for (const src of SUPPLIER_SOURCES) {
    try {
      const res = await fetch(src);
      if (!res.ok) continue;
      const supplierData = await res.json();
      const existingKeys = new Set(DATA.items.map(i => `${i.stream}:${i.url}`).filter(Boolean));
      const newItems = (supplierData.items || []).filter(i => !existingKeys.has(`${i.stream}:${i.url}`));
      DATA.items = [...DATA.items, ...newItems];
      break;
    } catch (e) { /* supplier data no disponible todavía */ }

function renderMeta() {

// "Today" = editorial window: from yesterday 16:00 onward (spans two calendar days).
function todayWindowStart() {
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() - 1);
  start.setHours(16, 0, 0, 0);
  return start;
}

function inWindow(item) {
  if (state.window === "history") return true;
  return new Date(item.datetime) >= todayWindowStart();
}

// ---------- Streams ----------
function renderStreams() {
  const nav = document.getElementById("streams");
  nav.innerHTML = "";
  STREAMS.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "stream-tab" + (state.stream === s.key ? " active" : "");
    btn.disabled = !s.enabled;
    const count = s.enabled ? countForStream(s.key) : 0;
    btn.innerHTML = s.label
      + (s.enabled && count ? `<span class="count">${count}</span>` : "")
      + (s.enabled ? "" : `<span class="soon">soon</span>`);
    if (s.enabled) btn.onclick = () => { state.stream = s.key; renderStreams(); render(); };
    nav.appendChild(btn);
  });
}

function countForStream(key) {
  if (key === "agenda") return agendaEventsInWindow().length;
  return DATA.items.filter(it => inWindow(it) && (key === "all" || it.stream === key)).length;
}

// Lunes de la semana actual (00:00) — así "esta semana + la que viene" es
// siempre el mismo bloque hasta que cambia la semana natural, en vez de
// recalcularse día a día desde "ahora".
function agendaMondayOfCurrentWeek() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  const day = d.getDay(); // 0=domingo .. 6=sábado
  const diffToMonday = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diffToMonday);
  return d;
}

function agendaWindowRange() {
  const monday = agendaMondayOfCurrentWeek();
  const start = new Date(monday);
  start.setDate(monday.getDate() + agendaState.windowOffset * agendaState.windowSizeDays);
  const end = new Date(start);
  end.setDate(start.getDate() + agendaState.windowSizeDays);
  return { start, end };
}

function agendaEventsInWindow() {
  const { start, end } = agendaWindowRange();
  const startStr = start.toISOString().slice(0,10);
  const endStr = end.toISOString().slice(0,10);
  let evs = AGENDA_DATA.filter(e => e.date >= startStr && e.date < endStr);
  if (agendaState.filter === "cubrir") evs = evs.filter(agendaToCover);
  return evs.sort((a,b) => (a.date + (a.time||"99:99")).localeCompare(b.date + (b.time||"99:99")));
}

// ---------- Filters ----------
function renderSectorPills() {
  const container = document.getElementById("sector-filters");
  if (!container) return;
  const cats = SECTOR_CONFIG.categories || [];
  if (!cats.length) { container.style.display = "none"; return; }

  container.innerHTML = cats.map(cat => {
    const active = state.sector === cat.id;
    const count = currentItemsForSector(cat.id);
    if (!count) return "";
    return `<button class="sector-pill${active ? " active" : ""}"
      style="background:${cat.color}18;color:${cat.color}"
      data-sector="${cat.id}">${cat.label} <span style="opacity:.7">${count}</span></button>`;
  }).join("");

  container.querySelectorAll("[data-sector]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.sector = state.sector === btn.dataset.sector ? "" : btn.dataset.sector;
      renderSectorPills();
      renderCompanyTags();
      render();
    });
  });
}

function currentItemsForSector(sectorId) {
  return DATA.items.filter(it =>
    inWindow(it) &&
    (state.stream === "all" || it.stream === state.stream) &&
    it.retail_sector === sectorId
  ).length;
}

function renderCompanyTags() {
  const container = document.getElementById("company-tags");
  if (!container) return;

  // Empresas visibles con el filtro actual (excepto company)
  const visible = DATA.items.filter(it =>
    inWindow(it) &&
    (state.stream === "all" || it.stream === state.stream) &&
    (!state.sector || it.retail_sector === state.sector) &&
    (!state.hideNoise || !it.is_noise) &&
    (!state.techOnly || it.tech_signal)
  );

  const companies = [...new Set(visible.map(i => i.companyname).filter(Boolean))].sort();
  if (!companies.length) { container.innerHTML = ""; return; }

  container.innerHTML = companies.map(c => {
    const active = state.company === c;
    return `<button class="company-tag${active ? " active" : ""}" data-company="${c}">${c}</button>`;
  }).join("");

  container.querySelectorAll("[data-company]").forEach(btn => {
    btn.addEventListener("click", () => {
      state.company = state.company === btn.dataset.company ? "" : btn.dataset.company;
      renderCompanyTags();
      render();
    });
  });
}

function buildFilterOptions() {
  const types = [...new Set(DATA.items.map(i => i.story_type).filter(Boolean))].sort();
  const typeSel = document.getElementById("filter-type");
  types.forEach(t => typeSel.insertAdjacentHTML("beforeend", `<option value="${t}">${t}</option>`));

// ---------- Bloomberg-method prompt builder ----------
// This is copied to the clipboard, not sent anywhere — the dashboard has no
// backend and never calls any AI directly. Paste it into a Claude
// conversation to get the actual draft.
function buildDraftPrompt(item) {
  return `Write a news story about the press release below, following Bloomberg's four-paragraph lead method and Retail Week house style.

BLOOMBERG METHOD:
- Headline: max ~64 characters. Lead with the newsworthy name. First few words must hook the reader. Convey what's at stake.
- Paragraph 1 (the lead/theme): what happened AND why it matters ("what... so what"). Under 20 words if possible. Only the single most newsworthy figure — no pile of numbers.
- Paragraph 2 (details): the essential facts and figures that support the theme. Dose the data — don't dump every number, save the rest for later in the piece.
- Paragraph 3 (quote): a plain-English quote from an authoritative source backing the theme. If none is available in the source material, note that a quote is needed rather than inventing one.
- Paragraph 4 (nut graph): what's at stake going forward — winners/losers, outlook. This paragraph should NOT be something that could have been written yesterday; it must reflect today's news specifically.
- Include a short "to be sure" section (1-2 paragraphs) presenting at least one other side of the story.

RETAIL WEEK STYLE:
- Terse, straightforward. No padding, no throat-clearing.
- British English spelling and terminology throughout.
- Present tense for immediate developments where natural.

SOURCE MATERIAL
Company: ${item.companyname || "—"} ${item.companycode ? "(" + item.companycode + ")" : ""}
Headline: ${item.title}
Date: ${item.datetime}
Sector: ${item.icbsector || "—"}
Source URL: ${item.url || "—"}

Full press release text:
"""
${item.body || "(no body text captured for this item)"}
"""

Write the draft now.`;
}

async function copyToClipboard(text, feedbackEl) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) { /* give up silently */ }
    document.body.removeChild(ta);
  }
  if (feedbackEl) {
    feedbackEl.classList.add("show");
    setTimeout(() => feedbackEl.classList.remove("show"), 1400);
  }
}

// ---------- Main render ----------
function currentItems() {
  return DATA.items
    .filter(inWindow)
    .filter(it => state.stream === "all" || it.stream === state.stream)
    .filter(it => !state.type || it.story_type === state.type)
    .filter(it => !state.company || it.companyname === state.company)
    .filter(it => !state.sector || it.retail_sector === state.sector)
    .filter(it => !state.search || it.title.toLowerCase().includes(state.search.toLowerCase()))
    .filter(it => !state.hideNoise || !it.is_noise)
    .filter(it => !state.techOnly || it.tech_signal)
    .sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
}

function render() {
  // ---- toggle visibilidad de controles según stream activo ----
  const isAgenda = state.stream === "agenda";
  document.querySelector(".controls").style.display = isAgenda ? "none" : "flex";
  document.getElementById("sector-filters").style.display = isAgenda ? "none" : "";
  document.getElementById("company-tags").style.display = isAgenda ? "none" : "";
  document.getElementById("agenda-toolbar").style.display = isAgenda ? "flex" : "none";
  if (!isAgenda) {
    document.getElementById("agenda-manual-form").classList.remove("open");
    document.getElementById("agenda-settings-form").classList.remove("open");
  }

  if (isAgenda) { renderAgenda(); return; }

  const items = currentItems();
  const box = document.getElementById("stories");
  document.getElementById("result-count").textContent =
    `${items.length} ${items.length === 1 ? "story" : "stories"}`;
  document.getElementById("meta-window").textContent =
    state.window === "today" ? "Today" : "History";

  if (!items.length) {
    box.innerHTML = `<div class="empty-state">No stories match these filters.</div>`;
    return;
  }

  box.innerHTML = items.map((it, idx) => {
    const uid = String(it.id ?? idx);
    const d = new Date(it.datetime);
    const time = d.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
    const date = d.toLocaleDateString("en-GB", { day:"2-digit", month:"short" });
    const isNew = new Date(it.datetime) >= todayWindowStart();
    const streamLabel = (STREAMS.find(s => s.key === it.stream) || {}).label || it.stream;
    const isExpanded = state.expanded.has(uid);
    const isRead = readIds.has(uid);

    // Tag de medio — visible para artículos de noticias
    const sourceTag = it.source_name
      ? `<span class="tag tag-source">${it.source_name}</span>`
      : "";

    const flags = [
      `<span class="tag tag-stream">${streamLabel}</span>`,
      sourceTag,
      it.story_type ? `<span class="tag tag-type">${it.story_type}</span>` : "",
      it.paywall ? `<span class="tag tag-paywall">Paywall</span>` : "",
      it.tech_signal ? `<span class="tag tag-tech">Tech partnership</span>` : "",
      (isNew && state.window === "history") ? `<span class="tag tag-new">New</span>` : "",
      it.reviewed_by ? `<span class="tag tag-reviewed" title="${it.review_note ? it.review_note.replace(/"/g,'&quot;') : ''}">AI-reviewed</span>` : "",
    ].filter(Boolean).join("");

    const company = it.companyname
      ? `<span class="story-company">${it.companyname}${it.companycode ? ` · <span class="ticker">${it.companycode}</span>` : ""}${it.icbsector ? ` · ${it.icbsector}` : ""}</span>`
      : `<span class="story-company">${it.source || ""}</span>`;

    // Body: para artículos de noticias usa summary, para LSE usa body completo
    const bodyContent = it.body || it.summary;
    const bodyHtml = bodyContent
      ? `<div class="story-body">${typeof marked !== 'undefined' ? marked.parse(bodyContent) : escapeHtml(bodyContent)}</div>`
      : `<div class="story-body empty">No text available for this item.</div>`;

    return `
      <article class="story${it.is_noise ? " is-noise" : ""}${isExpanded ? " expanded" : ""}${isRead ? " is-read" : ""}" data-uid="${uid}">
        <div class="story-row" data-toggle="${uid}">
          <div class="story-time">${time}<span class="date">${date}</span></div>
          <div class="story-main">
            <div class="story-flags">${flags}</div>
            <h2 class="story-title">${it.title}</h2>
            ${company}
          </div>
          <div class="story-chevron">›</div>
        </div>
        <div class="story-panel">
          ${bodyHtml}
          <div class="story-actions-row">
            <button class="btn" data-copy="${uid}">Copy text</button>
            <button class="btn btn-primary" data-draft="${uid}" ${it.body ? "" : "disabled"} title="Copy article id — paste into Claude Code as /draft ${it.id}">Draft</button>
            ${it.url ? `<a class="btn-link" href="${it.url}" target="_blank" rel="noopener">Source ↗</a>` : ""}
            <span class="copy-feedback" data-feedback="${uid}">Copied</span>
          </div>
        </div>
      </article>`;
  }).join("");

  // Wire up per-story events (row toggle + copy buttons)
  box.querySelectorAll("[data-toggle]").forEach(row => {
    row.addEventListener("click", () => {
      const uid = row.dataset.toggle;
      if (state.expanded.has(uid)) {
        state.expanded.delete(uid);
      } else {
        state.expanded.add(uid);
        // Mark as read when expanded
        readIds.add(uid);
        saveRead(readIds);
      }
      render();
    });
  });
  box.querySelectorAll("[data-copy]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const uid = btn.dataset.copy;
      const item = items.find((it, idx) => String(it.id ?? idx) === uid);
      const fb = box.querySelector(`[data-feedback="${uid}"]`);
      copyToClipboard(item.body || "", fb);
    });
  });
  box.querySelectorAll("[data-draft]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const uid = btn.dataset.draft;
      const item = items.find((it, idx) => String(it.id ?? idx) === uid);
      const fb = box.querySelector(`[data-feedback="${uid}"]`);
      copyToClipboard(`/draft ${item.id}`, fb);
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Agenda render ----------
function renderAgenda() {
  const box = document.getElementById("stories");
  const events = agendaEventsInWindow();

  const { start, end: endExclusive } = agendaWindowRange();
  const end = new Date(endExclusive);
  end.setDate(end.getDate() - 1); // mostrar el último día inclusive, no el exclusivo
  const fmt = d => d.toLocaleDateString("es-AR", { day: "numeric", month: "short" });
  document.getElementById("agenda-range-label").textContent = `${fmt(start)} — ${fmt(end)}`;
  document.getElementById("result-count").textContent =
    `${events.length} ${events.length === 1 ? "evento" : "eventos"}`;

  if (!events.length) {
    box.innerHTML = `<div class="empty-state">No hay eventos ${agendaState.filter === "cubrir" ? "marcados para cubrir " : ""}en este período.</div>`;
    return;
  }

  const grouped = {};
  events.forEach(e => (grouped[e.date] = grouped[e.date] || []).push(e));

  box.innerHTML = Object.keys(grouped).sort().map(date => {
    const dayLabel = new Date(date + "T00:00:00").toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
    const cards = grouped[date].map(agendaCardHtml).join("");
    return `<div class="agenda-day-header">${dayLabel}</div>${cards}`;
  }).join("");

  // wire per-card handlers
  box.querySelectorAll("[data-agenda-cover]").forEach(cb => {
    cb.addEventListener("change", () => {
      setAgendaOverride(cb.dataset.agendaCover, cb.checked);
      render();
    });
  });
  box.querySelectorAll("[data-agenda-research]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.agendaResearch;
      const fb = box.querySelector(`[data-agenda-feedback="${id}"]`);
      copyToClipboard(`/agenda-research ${id}`, fb);
    });
  });
  box.querySelectorAll("[data-agenda-delete]").forEach(link => {
    link.addEventListener("click", async (e) => {
      e.preventDefault();
      const id = link.dataset.agendaDelete;
      if (!confirm("¿Borrar este evento manual?")) return;
      if (!ghConfigured()) {
        alert("No hay guardado en GitHub configurado (⚙) — borrando solo de esta sesión.");
        AGENDA_DATA = AGENDA_DATA.filter(e2 => e2.id !== id);
        render();
        return;
      }
      try {
        await deleteManualEvent(id);
        AGENDA_DATA = AGENDA_DATA.filter(e2 => e2.id !== id);
        render();
      } catch (err) {
        alert("Error borrando en GitHub: " + err.message);
      }
    });
  });
}

function gcalUrl(ev) {
  const title = encodeURIComponent(ev.title);
  const details = encodeURIComponent(
    [ev.summary, ev.detail_url ? `Fuente: ${ev.detail_url}` : ""].filter(Boolean).join("\n\n")
  );
  const location = encodeURIComponent(ev.location || "");
  let dates;
  if (ev.time) {
    const [hh, mm] = ev.time.split(":");
    const startD = new Date(`${ev.date}T${hh}:${mm}:00`);
    const endD = new Date(startD.getTime() + 60 * 60 * 1000); // 1h por defecto
    const fmt = d => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    dates = `${fmt(startD)}/${fmt(endD)}`;
  } else {
    const d0 = ev.date.replace(/-/g, "");
    const d1 = new Date(ev.date + "T00:00:00");
    d1.setDate(d1.getDate() + 1);
    const d1str = d1.toISOString().slice(0,10).replace(/-/g, "");
    dates = `${d0}/${d1str}`;
  }
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}&location=${location}`;
}

function agendaCardHtml(ev) {
  const toCover = agendaToCover(ev);
  const catLabel = AGENDA_CATEGORY_LABELS[ev.category] || ev.category;
  const badges = [
    ev.needs_confirmation ? `<span class="agenda-badge-unconfirmed">sin confirmar</span>` : "",
    ev.manual ? `<span class="agenda-manual-badge">manual</span>` : "",
  ].filter(Boolean).join("");

  const metaLinks = [
    ev.registration?.required ? `<span>📝 Inscripción${ev.registration.cost ? " · " + ev.registration.cost : ""}</span>` : "",
    ev.registration?.link ? `<a href="${ev.registration.link}" target="_blank" rel="noopener">Inscribirse ↗</a>` : "",
    ev.materials?.agenda_link ? `<a href="${ev.materials.agenda_link}" target="_blank" rel="noopener">Agenda/material ↗</a>` : "",
    ev.detail_url ? `<a href="${ev.detail_url}" target="_blank" rel="noopener">Fuente ↗</a>` : "",
    toCover ? `<a href="${gcalUrl(ev)}" target="_blank" rel="noopener">+ Google Calendar ↗</a>` : "",
    ev.manual ? `<a href="#" data-agenda-delete="${ev.id}" style="color:var(--flag)">Borrar</a>` : "",
  ].filter(Boolean).join("");

  const research = toCover ? (
    ev.research_summary
      ? `<div class="agenda-research"><div class="agenda-research-label">Research</div>${typeof marked !== 'undefined' ? marked.parse(ev.research_summary) : escapeHtml(ev.research_summary)}</div>`
      : `<div class="agenda-research">
           <button class="btn" data-agenda-research="${ev.id}">Pedir research a Claude</button>
           <span class="copy-feedback" data-agenda-feedback="${ev.id}">Copiado — pegalo en Claude Code</span>
         </div>`
  ) : "";

  return `
    <div class="agenda-card" data-uid="${ev.id}">
      <div class="agenda-card-header">
        <span class="agenda-cat">${catLabel}</span>
        ${ev.time ? `<span class="agenda-time">${ev.time}</span>` : ""}
        ${badges}
        <label class="agenda-cover-toggle">
          <input type="checkbox" data-agenda-cover="${ev.id}" ${toCover ? "checked" : ""}> a cubrir
        </label>
      </div>
      <div class="agenda-title">${ev.title}</div>
      ${ev.company ? `<div class="agenda-company">${ev.company}</div>` : ""}
      ${ev.location ? `<div class="agenda-location">📍 ${ev.location}</div>` : ""}
      ${ev.summary ? `<div class="agenda-summary">${escapeHtml(ev.summary)}</div>` : ""}
      ${metaLinks ? `<div class="agenda-meta-row">${metaLinks}</div>` : ""}
      ${research}
    </div>`;
}

// ---------- Agenda events ----------
document.getElementById("agenda-prev").addEventListener("click", () => {
  agendaState.windowOffset -= 1;
  render();
});
document.getElementById("agenda-next").addEventListener("click", () => {
  agendaState.windowOffset += 1;
  render();
});
document.getElementById("agenda-filter-todos").addEventListener("click", () => {
  agendaState.filter = "todos";
  document.getElementById("agenda-filter-todos").classList.add("active");
  document.getElementById("agenda-filter-cubrir").classList.remove("active");
  render();
});
document.getElementById("agenda-filter-cubrir").addEventListener("click", () => {
  agendaState.filter = "cubrir";
  document.getElementById("agenda-filter-cubrir").classList.add("active");
  document.getElementById("agenda-filter-todos").classList.remove("active");
  render();
});
document.getElementById("agenda-add-toggle").addEventListener("click", () => {
  document.getElementById("agenda-manual-form").classList.toggle("open");
  document.getElementById("agenda-settings-form").classList.remove("open");
});
document.getElementById("agenda-settings-toggle").addEventListener("click", () => {
  document.getElementById("agenda-settings-form").classList.toggle("open");
  document.getElementById("agenda-manual-form").classList.remove("open");
  const c = getGhConfig();
  const f = document.getElementById("agenda-settings-form");
  f.gh_owner.value = c.gh_owner || "";
  f.gh_repo.value = c.gh_repo || "";
  f.gh_path.value = c.gh_path || "manual_events.json";
  f.gh_token.value = c.gh_token || "";
});
document.getElementById("agenda-settings-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target;
  setGhConfig({
    gh_owner: f.gh_owner.value.trim(),
    gh_repo: f.gh_repo.value.trim(),
    gh_path: f.gh_path.value.trim() || "manual_events.json",
    gh_token: f.gh_token.value.trim(),
  });
  const fb = document.getElementById("agenda-settings-feedback");
  fb.classList.add("show");
  setTimeout(() => fb.classList.remove("show"), 1400);
  f.classList.remove("open");
});
document.getElementById("agenda-manual-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  const ev = {
    id: "manual-" + Date.now().toString(36),
    source: "manual", manual: true, to_cover: true,
    category: f.category.value,
    title: f.title.value,
    date: f.date.value,
    time: f.time.value || null,
    location: f.location.value || null,
    company: null,
    registration: {
      required: f.registration_required.checked,
      cost: null,
      link: f.registration_link.value || null,
    },
    materials: { agenda_link: null, prior_report_link: null },
    summary: f.summary.value.trim() || null,
    research_summary: null,
    detail_url: null,
  };

  const submitBtn = f.querySelector("button[type=submit]");
  const fb = document.getElementById("agenda-manual-feedback");

  if (ghConfigured()) {
    submitBtn.disabled = true;
    submitBtn.textContent = "Guardando…";
    try {
      await saveManualEvent(ev);
      AGENDA_DATA.push(ev);
      fb.textContent = "Guardado en GitHub ✓";
      fb.classList.add("show");
      setTimeout(() => fb.classList.remove("show"), 2000);
      f.reset();
      document.getElementById("agenda-manual-form").classList.remove("open");
      render();
    } catch (err) {
      alert("No se pudo guardar en GitHub: " + err.message + "\n\nRevisá el token/permisos en ⚙, o el evento se puede perder al refrescar.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Guardar";
    }
  } else {
    // Sin config de GitHub: fallback — queda solo en esta sesión, pero te
    // doy el JSON para pegar a mano en manual_events.json.
    AGENDA_DATA.push(ev);
    copyToClipboard(JSON.stringify(ev, null, 2), fb);
    fb.textContent = "Copiado (sin guardado en GitHub — pegalo en manual_events.json)";
    alert("No configuraste guardado en GitHub (⚙). Copié el JSON del evento al portapapeles para que lo pegues a mano en manual_events.json del repo — si no, se pierde al refrescar.");
    f.reset();
    document.getElementById("agenda-manual-form").classList.remove("open");
    render();
  }
});

// ---------- Events ----------
document.getElementById("window-seg").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#window-seg button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  state.window = e.target.dataset.window;
  renderStreams(); render();
});
document.getElementById("filter-type").addEventListener("change", e => { state.type = e.target.value; render(); });
document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; render(); });
document.getElementById("noise-toggle").addEventListener("change", e => { state.hideNoise = e.target.checked; render(); });
document.getElementById("tech-toggle").addEventListener("change", e => { state.techOnly = e.target.checked; render(); });

loadData();
</script>
</body>
</html>
