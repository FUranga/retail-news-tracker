name: Media scraper (UK retail news)

on:
  schedule:
    # GitHub Actions cron usa UTC. UK está en BST (UTC+1) hasta finales de octubre.
    # Ajustar +1h en UTC cuando termine BST (finales de octubre).
    - cron: "30 5 * * 1-5"   # 06:30 BST
    - cron: "5 6 * * 1-5"    # 07:05 BST
    - cron: "0 10 * * 1-5"   # 11:00 BST
    - cron: "0 13 * * 1-5"   # 14:00 BST
    - cron: "0 15 * * 1-5"   # 16:00 BST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests feedparser

      - name: Correr media scraper
        run: python media_scraper.py

      - name: Commitear cambios
        run: |
          git config user.name "media-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media_data.json
          git diff --staged --quiet && echo "Sin cambios nuevos" && exit 0
          git commit -m "Media update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
