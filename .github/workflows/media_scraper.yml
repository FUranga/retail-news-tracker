name: Media scraper (UK retail news)

on:
  schedule:
    - cron: "15 5 * * 1-5"
    - cron: "45 5 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "15 10 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "15 15 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: media-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests feedparser trafilatura

      - name: Correr media scraper
        run: python media_scraper.py

      - name: Commitear cambios
        run: |
          git config user.name "media-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media_data.json
          git diff --staged --quiet && echo "Sin cambios nuevos" && exit 0
          git commit -m "Media update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase=false --strategy=ours origin main || git pull origin main
          git push
