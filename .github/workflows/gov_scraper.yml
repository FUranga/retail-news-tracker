name: Gov scraper (UK government & statistics)

on:
  schedule:
    # Re-registrado 2026-08-31 (ver lse_scraper.yml) tras dejar de dispararse.
    # Ver nota de DST en lse_scraper.yml: se schedulean ambos horarios UTC
    # (BST y GMT) para cada hora local deseada; schedule_guard.py decide
    # cuál corresponde en tiempo real. No hace falta tocar esto por DST.
    - cron: "0 6 * * 1-5"     # 07:00 UK — BST
    - cron: "45 8 * * 1-5"    # 09:45 UK — BST (post-ONS, casi siempre publica a las 9:30)
    - cron: "30 11 * * 1-5"   # 12:30 UK — BST
    - cron: "30 13 * * 1-5"   # 14:30 UK — BST (post-PMQs y committee hearings)
    - cron: "30 16 * * 1-5"   # 17:30 UK — BST (cierre del día parlamentario)
    - cron: "0 7 * * 1-5"     # 07:00 UK — GMT
    - cron: "45 9 * * 1-5"    # 09:45 UK — GMT
    - cron: "30 12 * * 1-5"   # 12:30 UK — GMT
    - cron: "30 14 * * 1-5"   # 14:30 UK — GMT
    - cron: "30 17 * * 1-5"   # 17:30 UK — GMT
  workflow_dispatch: {}

concurrency:
  group: gov-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests feedparser trafilatura tzdata

      - name: Correr gov scraper
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python gov_scraper.py

      - name: Commitear cambios
        run: |
          git config user.name "gov-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gov_data.json
          git diff --staged --quiet && echo "Sin cambios nuevos" && exit 0
          git commit -m "Gov update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
