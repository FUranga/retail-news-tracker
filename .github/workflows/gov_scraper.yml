name: Gov scraper (UK government & statistics)

on:
  schedule:
    - cron: "0 6 * * 1-5"    # 07:00 BST
    - cron: "45 8 * * 1-5"   # 09:45 BST
    - cron: "30 11 * * 1-5"  # 12:30 BST
    - cron: "30 13 * * 1-5"  # 14:30 BST
    - cron: "30 16 * * 1-5"  # 17:30 BST
  workflow_dispatch: {}

concurrency:
  group: gov-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests feedparser

      - name: Correr gov scraper
        run: python gov_scraper.py

      - name: Commitear cambios
        run: |
          git config user.name "gov-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gov_data.json
          git diff --staged --quiet && echo "Sin cambios nuevos" && exit 0
          git commit -m "Gov update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase=false --strategy=ours origin main || git pull origin main
          git push
