name: LSE scraper (Retailers + Grocery)

on:
  schedule:
    # GitHub Actions cron corre siempre en UTC. Para no tener que editar
    # este archivo dos veces al año por el cambio BST/GMT, se schedulean
    # AMBOS horarios UTC posibles para cada hora deseada en Londres
    # (07:01 y 07:15). schedule_guard.py (corrido dentro de
    # lse_scraper.py) decide en tiempo real cuál de las dos corridas
    # corresponde a la hora real de Londres y sale sin hacer nada en la
    # que no toca — no hay que tocar este archivo nunca más por DST.
    - cron: "1 6 * * 1-5"    # 07:01 UK time — vigente en BST (verano)
    - cron: "15 6 * * 1-5"   # 07:15 UK time — vigente en BST (verano)
    - cron: "1 7 * * 1-5"    # 07:01 UK time — vigente en GMT (invierno)
    - cron: "15 7 * * 1-5"   # 07:15 UK time — vigente en GMT (invierno)
  workflow_dispatch: {}      # permite correrlo a mano desde la pestaña Actions

concurrency:
  group: lse-scraper
  cancel-in-progress: false

permissions:
  contents: write   # necesario para que el job pueda commitear el resultado

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests pandas markdownify tzdata

      - name: Correr scraper LSE
        id: scrape
        env:
          # workflow_dispatch (corrida manual) siempre hace el trabajo,
          # sin importar la hora — así sirve para probar/depurar.
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python lse_scraper.py

      - name: Actualizar dashboard_data.json
        if: steps.scrape.outputs.did_work == 'true'
        run: python transform_to_dashboard.py lse_latest.csv

      - name: Commitear cambios
        if: steps.scrape.outputs.did_work == 'true'
        run: |
          git config user.name "lse-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/*.csv dashboard_data.json unmapped_categories.json
          git diff --staged --quiet && echo "Sin cambios, nada que commitear" && exit 0
          git commit -m "Actualización automática LSE $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
