name: Company scraper (UK retailers press)

on:
  schedule:
    # Ver nota de DST en lse_scraper.yml: se schedulean ambos horarios UTC
    # (BST y GMT) para cada hora local deseada; schedule_guard.py decide
    # cuál corresponde en tiempo real. No hace falta tocar esto por DST.
    - cron: "0 6 * * 1-5"    # 07:00 UK — BST
    - cron: "0 8 * * 1-5"    # 09:00 UK — BST
    - cron: "0 11 * * 1-5"   # 12:00 UK — BST
    - cron: "0 14 * * 1-5"   # 15:00 UK — BST
    - cron: "0 16 * * 1-5"   # 17:00 UK — BST
    - cron: "0 7 * * 1-5"    # 07:00 UK — GMT
    - cron: "0 9 * * 1-5"    # 09:00 UK — GMT
    - cron: "0 12 * * 1-5"   # 12:00 UK — GMT
    - cron: "0 15 * * 1-5"   # 15:00 UK — GMT
    - cron: "0 17 * * 1-5"   # 17:00 UK — GMT
  workflow_dispatch: {}

concurrency:
  group: company-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests feedparser trafilatura tzdata

      - name: Correr company scraper
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python company_scraper.py

      - name: Commitear cambios
        run: |
          git config user.name "company-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add company_data.json
          git diff --staged --quiet && echo "Sin cambios nuevos" && exit 0
          git commit -m "Company update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
