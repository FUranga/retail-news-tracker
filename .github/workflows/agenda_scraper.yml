name: Agenda scraper (retail UK — estadísticas, earnings, reuniones, eventos)

on:
  schedule:
    # GitHub Actions cron usa UTC. UK está en BST (UTC+1) hasta finales de
    # octubre. Ajustar +1h en UTC cuando termine BST, igual que en los
    # otros workflows del repo.
    - cron: "0 6 * * 1-5"    # 07:00 BST — una vez por día alcanza acá
  workflow_dispatch: {}       # permite correrlo a mano desde la pestaña Actions

concurrency:
  group: agenda-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests feedparser beautifulsoup4

      - name: Correr agenda scraper
        working-directory: agenda
        run: python agenda_scraper.py

      - name: Commitear cambios
        run: |
          git config user.name "agenda-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agenda_data.json agenda_to_cover.ics
          git diff --staged --quiet && echo "Sin cambios nuevos" && exit 0
          git commit -m "Agenda update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase=false --strategy=ours origin main || git pull origin main
          git push
