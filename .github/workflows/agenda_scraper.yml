name: Agenda scraper (retail UK — estadísticas, earnings, reuniones, eventos)

on:
  schedule:
    # Ver nota de DST en lse_scraper.yml: se schedulean ambos horarios UTC
    # (BST y GMT) para la hora local deseada; schedule_guard.py decide
    # cuál corresponde en tiempo real. No hace falta tocar esto por DST.
    - cron: "0 6 * * 1-5"   # 07:00 UK — BST
    - cron: "0 7 * * 1-5"   # 07:00 UK — GMT
  workflow_dispatch: {}      # permite correrlo a mano desde la pestaña Actions

concurrency:
  group: agenda-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests feedparser beautifulsoup4 tzdata

      - name: Correr agenda scraper
        working-directory: agenda
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python agenda_scraper.py

      - name: Commitear cambios
        run: |
          git config user.name "agenda-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agenda_data.json agenda_to_cover.ics
          git diff --staged --quiet && echo "Sin cambios nuevos" && exit 0
          git commit -m "Agenda update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
